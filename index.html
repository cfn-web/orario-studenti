<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orario per studenti — 5–9 ottobre 2026</title>
<style>
.orario-studenti{--os-primary:#174a7c;--os-primary-dark:#103657;--os-accent:#e8f1f8;--os-border:#d8e1e8;--os-text:#1e2933;--os-muted:#667786;max-width:1200px;margin:0 auto;font-family:inherit;color:var(--os-text)}
.orario-studenti *{box-sizing:border-box}
.os-header{background:linear-gradient(135deg,var(--os-primary),var(--os-primary-dark));color:#fff;border-radius:14px;padding:24px;margin-bottom:22px}
.os-header h2{margin:0 0 6px;color:#fff;font-size:clamp(1.45rem,3vw,2rem)}
.os-header p{margin:0;opacity:.92}
.os-selector{background:#fff;border:1px solid var(--os-border);border-radius:14px;padding:20px;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.os-step{margin-bottom:18px}.os-step:last-child{margin-bottom:0}
.os-label{display:block;font-weight:700;margin-bottom:8px}
.os-select{width:100%;min-height:48px;border:2px solid var(--os-primary);border-radius:10px;padding:10px 14px;font-size:1rem;background:#fff;color:var(--os-text)}
.os-select:disabled{opacity:.55;cursor:not-allowed}
.os-hint{color:var(--os-muted);font-size:.9rem;margin-top:8px}
.os-class-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.os-class-btn{border:1px solid var(--os-border);background:#fff;color:var(--os-primary);border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer;transition:.15s ease}
.os-class-btn:hover,.os-class-btn.is-active{background:var(--os-primary);color:#fff;border-color:var(--os-primary)}
.os-class-nav[hidden]{display:none}
.os-result{margin-top:22px;display:none}.os-result.is-visible{display:block}
.os-result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.os-result-head h3{margin:0;color:var(--os-primary-dark);font-size:1.5rem}
.os-week{color:var(--os-muted);font-size:.92rem;margin-top:4px}
.os-print{border:1px solid var(--os-primary);background:#fff;color:var(--os-primary);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.os-table-wrap{overflow-x:auto;border:1px solid var(--os-border);border-radius:12px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.05)}
.os-table{width:100%;min-width:850px;border-collapse:collapse}
.os-table th,.os-table td{border:1px solid var(--os-border);padding:11px 10px;vertical-align:top;text-align:center}
.os-table thead th{background:var(--os-accent);color:var(--os-primary-dark);font-weight:800}
.os-table .os-hour{width:105px;white-space:nowrap;background:#f7f9fb;font-weight:800;color:var(--os-primary-dark)}
.os-subject{font-weight:700;line-height:1.3}.os-empty{color:#9aa7b1}
.os-mobile-note{display:none;margin-top:10px;color:var(--os-muted);font-size:.88rem}
@media(max-width:720px){
 .os-header{padding:18px;border-radius:11px}.os-selector{padding:15px}.os-class-nav{display:none}
 .os-result-head{align-items:stretch;flex-direction:column}.os-print{width:100%}.os-mobile-note{display:block}
 .os-table{min-width:0}.os-table thead{display:none}
 .os-table,.os-table tbody,.os-table tr,.os-table td{display:block;width:100%}
 .os-table tr{border-bottom:1px solid var(--os-border);padding:10px 0}.os-table tr:last-child{border-bottom:0}
 .os-table td{border:0;padding:7px 12px;text-align:left}.os-table .os-hour{width:auto;background:var(--os-accent);margin-bottom:2px}
 .os-table td[data-day]::before{content:attr(data-day);display:block;font-size:.78rem;font-weight:800;color:var(--os-muted);text-transform:uppercase;margin-bottom:2px}
}
@media print{
 body *{visibility:hidden}.orario-studenti,.orario-studenti *{visibility:visible}
 .orario-studenti{position:absolute;left:0;top:0;width:100%}.os-selector,.os-print,.os-mobile-note{display:none!important}
 .os-result{display:block!important}.os-table{min-width:0}
}
</style>
</head>

  <section class="os-result" id="os-result" aria-live="polite">

      <button class="os-print" id="os-print" type="button">🖨 Stampa / Salva PDF</button>

    <div class="os-table-wrap">

    </div>
    <div class="os-mobile-note">Su smartphone l'orario viene visualizzato per singola ora.</div>
  </section>
</div>

const root=document.getElementById("orario-studenti-app");
if(!root)return;

const yearSelect=root.querySelector("#os-year-select");
const classSelect=root.querySelector("#os-class-select");
const classNav=root.querySelector("#os-class-nav");
const result=root.querySelector("#os-result");
const title=root.querySelector("#os-result-title");
const tbody=root.querySelector("#os-tbody");
const printBtn=root.querySelector("#os-print");

DATA.classes.sort((a,b)=>a.classe.localeCompare(b.classe,"it",{numeric:true,sensitivity:"base"}));

function getYear(c){const m=String(c).match(/^([1-5])/);return m?Number(m[1]):null}
function classId(n){return "os-"+n.replace(/[^a-zA-Z0-9]/g,"-").toLowerCase()}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

function clearClassChoice(){
 classSelect.innerHTML='<option value="">— Seleziona la classe —</option>';
 classSelect.disabled=true;
 classNav.innerHTML="";
 classNav.hidden=true;
 result.classList.remove("is-visible");
 tbody.innerHTML="";
 title.textContent="";
}

function populateClasses(year){
 clearClassChoice();
 if(!year)return;
 const list=DATA.classes.filter(c=>getYear(c.classe)===year);
 list.forEach(item=>{
   const opt=document.createElement("option");
   opt.value=item.classe; opt.textContent=item.classe; classSelect.appendChild(opt);

   const btn=document.createElement("button");
   btn.type="button"; btn.className="os-class-btn"; btn.textContent=item.classe; btn.dataset.class=item.classe;
   btn.addEventListener("click",()=>showClass(item.classe));
   classNav.appendChild(btn);
 });
 classSelect.disabled=list.length===0;
 classNav.hidden=list.length===0;
}

function showClass(className){
 const item=DATA.classes.find(x=>x.classe===className);
 if(!item)return;
 const year=getYear(className);
 yearSelect.value=String(year||"");
 populateClasses(year);
 classSelect.value=className;
 title.textContent="Orario "+className;
 tbody.innerHTML="";

 DATA.periods.forEach((period,p)=>{
   const tr=document.createElement("tr");
   const hour=document.createElement("td"); hour.className="os-hour";
   hour.innerHTML="<strong>"+esc(period)+"</strong><br><small>"+esc(DATA.time_ranges[p])+"</small>";
   tr.appendChild(hour);

   DATA.days.forEach(day=>{
     const td=document.createElement("td"); td.dataset.day=day;
     const value=item.orario[day][p]||"";
     if(value.trim()){
       value.split(/\s*\/\s*/).forEach((s,i,arr)=>{
         const div=document.createElement("div"); div.className="os-subject"; div.textContent=s.trim(); td.appendChild(div);
         if(i<arr.length-1){const sep=document.createElement("div");sep.textContent=" / ";sep.style.fontSize=".8rem";sep.style.opacity=".65";td.appendChild(sep)}
       });
     }else td.innerHTML='<span class="os-empty">—</span>';
     tr.appendChild(td);
   });
   tbody.appendChild(tr);
 });

 root.querySelectorAll(".os-class-btn").forEach(b=>b.classList.toggle("is-active",b.dataset.class===className));
 result.classList.add("is-visible");
 history.replaceState(null,"","#"+encodeURIComponent(classId(className)));
 result.scrollIntoView({behavior:"smooth",block:"start"});
}

yearSelect.addEventListener("change",function(){populateClasses(Number(this.value)||null)});
classSelect.addEventListener("change",function(){if(this.value)showClass(this.value)});
printBtn.addEventListener("click",()=>window.print());

clearClassChoice();

const hash=decodeURIComponent(location.hash.replace(/^#/,""));
if(hash){
 const found=DATA.classes.find(x=>classId(x.classe)===hash);
 if(found)showClass(found.classe);
}
})();
